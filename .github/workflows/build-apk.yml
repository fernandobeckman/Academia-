name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required SDK components
        run: |
          yes | sdkmanager \
            "build-tools;34.0.0" \
            "platforms;android-34" \
            "platform-tools" 2>&1 | tail -5

      # ── Gera o keystore para assinar o APK ────────────────────────────────
      - name: Generate signing keystore
        run: |
          keytool -genkey -v \
            -keystore "$GITHUB_WORKSPACE/bulklog.keystore" \
            -alias bulklog \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass bulklog123 \
            -keypass  bulklog123 \
            -dname "CN=Bulk Log, O=BulkLog, C=BR"

      # ── Cria o projeto TWA mínimo ─────────────────────────────────────────
      - name: Create TWA project structure
        run: |
          mkdir -p twa/app/src/main/res/values
          mkdir -p twa/app/src/main/res/xml
          mkdir -p twa/gradle/wrapper

          # settings.gradle
          cat > twa/settings.gradle << 'EOF'
          rootProject.name = "BulkLog"
          include ':app'
          EOF

          # gradle-wrapper.properties
          cat > twa/gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.2-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

          # root build.gradle
          cat > twa/build.gradle << 'EOF'
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.1.0'
              }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF

          # app build.gradle
          cat > twa/app/build.gradle << 'EOF'
          apply plugin: 'com.android.application'

          android {
              namespace 'br.com.bulklog.app'
              compileSdk 34
              defaultConfig {
                  applicationId 'br.com.bulklog.app'
                  minSdk 19
                  targetSdk 34
                  versionCode 1
                  versionName '1.0.0'
              }
              signingConfigs {
                  release {
                      storeFile     file(System.getenv('KEYSTORE_PATH') ?: 'bulklog.keystore')
                      storePassword System.getenv('KEYSTORE_PASS') ?: 'bulklog123'
                      keyAlias      System.getenv('KEY_ALIAS')     ?: 'bulklog'
                      keyPassword   System.getenv('KEY_PASS')      ?: 'bulklog123'
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                  }
              }
          }

          dependencies {
              implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
          }
          EOF

          # AndroidManifest.xml
          cat > twa/app/src/main/AndroidManifest.xml << 'MANIFEST'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:label="@string/app_name"
                  android:icon="@mipmap/ic_launcher"
                  android:theme="@style/Theme.BulkLog"
                  android:allowBackup="false">

                  <activity
                      android:name="com.google.androidbrowserhelper.trusted.LauncherActivity"
                      android:exported="true">
                      <meta-data
                          android:name="android.support.customtabs.trusted.DEFAULT_URL"
                          android:value="@string/start_url" />
                      <meta-data
                          android:name="android.support.customtabs.trusted.STATUS_BAR_COLOR"
                          android:resource="@color/colorPrimary" />
                      <meta-data
                          android:name="android.support.customtabs.trusted.SPLASH_IMAGE_DRAWABLE"
                          android:resource="@drawable/splash" />
                      <meta-data
                          android:name="android.support.customtabs.trusted.SPLASH_SCREEN_BACKGROUND_COLOR"
                          android:resource="@color/colorPrimary" />
                      <meta-data
                          android:name="android.support.customtabs.trusted.SPLASH_SCREEN_FADE_OUT_DURATION"
                          android:value="300" />
                      <meta-data
                          android:name="android.support.customtabs.trusted.FILE_PROVIDER_AUTHORITY"
                          android:value="br.com.bulklog.app.fileprovider" />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                      <intent-filter android:autoVerify="true">
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="https"
                                android:host="fernandobeckman.github.io"
                                android:pathPrefix="/Academia-/" />
                      </intent-filter>
                  </activity>

                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="br.com.bulklog.app.fileprovider"
                      android:grantUriPermissions="true"
                      android:exported="false">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/filepaths" />
                  </provider>

                  <service
                      android:name="com.google.androidbrowserhelper.trusted.DelegationService"
                      android:enabled="@bool/enableNotification"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.support.customtabs.trusted.TRUSTED_WEB_ACTIVITY_SERVICE"/>
                          <category android:name="android.intent.category.DEFAULT"/>
                      </intent-filter>
                  </service>
              </application>
          </manifest>
          MANIFEST

          # strings.xml
          cat > twa/app/src/main/res/values/strings.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Bulk Log</string>
              <string name="start_url">https://fernandobeckman.github.io/Academia-/</string>
              <string name="asset_statements">[{"relation":["delegate_permission/common.handle_all_urls"],"target":{"namespace":"web","site":"https://fernandobeckman.github.io"}}]</string>
              <bool name="enableNotification">false</bool>
          </resources>
          EOF

          # colors.xml (tema escuro #16181A)
          cat > twa/app/src/main/res/values/colors.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="colorPrimary">#FF16181A</color>
              <color name="colorPrimaryDark">#FF16181A</color>
          </resources>
          EOF

          # styles.xml
          cat > twa/app/src/main/res/values/styles.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.BulkLog" parent="android:Theme.NoTitleBar.Fullscreen">
                  <item name="android:windowBackground">@color/colorPrimary</item>
              </style>
          </resources>
          EOF

          # filepaths.xml
          cat > twa/app/src/main/res/xml/filepaths.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <paths>
              <external-path name="external_files" path="." />
          </paths>
          EOF

          # splash drawable (rectangle sólido)
          mkdir -p twa/app/src/main/res/drawable
          cat > twa/app/src/main/res/drawable/splash.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#16181A"/>
          </shape>
          EOF

          # ícone placeholder (1x1 PNG transparente como base64)
          mkdir -p twa/app/src/main/res/mipmap-xxxhdpi
          python3 -c "
          import base64, os
          # PNG 1x1 transparent
          png = bytes.fromhex('89504e470d0a1a0a0000000d49484452000000010000000108060000001f15c489000000'
                              '0a49444154789c6260000000020001e221bc330000000049454e44ae426082')
          os.makedirs('twa/app/src/main/res/mipmap-mdpi', exist_ok=True)
          os.makedirs('twa/app/src/main/res/mipmap-hdpi', exist_ok=True)
          os.makedirs('twa/app/src/main/res/mipmap-xhdpi', exist_ok=True)
          os.makedirs('twa/app/src/main/res/mipmap-xxhdpi', exist_ok=True)
          os.makedirs('twa/app/src/main/res/mipmap-xxxhdpi', exist_ok=True)
          for d in ['mdpi','hdpi','xhdpi','xxhdpi','xxxhdpi']:
              open(f'twa/app/src/main/res/mipmap-{d}/ic_launcher.png','wb').write(png)
          "

          echo "Project structure created"

      - name: Download Gradle wrapper
        run: |
          cd twa
          wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp/
          /tmp/gradle-8.2/bin/gradle wrapper --gradle-version 8.2
          chmod +x gradlew

      - name: Build release APK
        run: |
          cd twa
          ./gradlew assembleRelease \
            -PKEYSTORE_PATH="$GITHUB_WORKSPACE/bulklog.keystore" \
            -PKEYSTORE_PASS=bulklog123 \
            -PKEY_ALIAS=bulklog \
            -PKEY_PASS=bulklog123 \
            --no-daemon 2>&1
        env:
          KEYSTORE_PATH: "${{ github.workspace }}/bulklog.keystore"
          KEYSTORE_PASS: "bulklog123"
          KEY_ALIAS: "bulklog"
          KEY_PASS: "bulklog123"

      - name: List APK files
        run: find twa -name "*.apk" | xargs ls -lh 2>/dev/null || echo "No APK found"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BulkLog-APK
          path: twa/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: warn
          retention-days: 30
