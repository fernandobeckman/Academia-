function beepSound(){try{const ctx=new(window.AudioContext||window.webkitAudioContext)();const o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.frequency.value=880;o.type='sine';g.gain.setValueAtTime(0.35,ctx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+1);o.start();o.stop(ctx.currentTime+1);}catch(e){}}
// ── Recordes Pessoais ──────────────────────────────────────────
function getPR(exId){return DB.get('pr:'+exId)||null;}
function checkAndSavePR(exId,kg,reps){
  if(!kg||kg<=0)return false;
  const pr=getPR(exId)||{kg:0,reps:0,date:''};
  if(kg>pr.kg||(kg===pr.kg&&reps>(pr.reps||0))){
    DB.set('pr:'+exId,{kg,reps:reps||0,date:todayISO()});
    showPRToast(kg,reps);return true;
  }return false;
}
function showPRToast(kg,reps){
  const el=document.createElement('div');
  el.style.cssText='position:fixed;top:18%;left:50%;transform:translateX(-50%);background:#3A2800;border:1px solid #FFB038;color:#FFB038;padding:14px 28px;border-radius:14px;font-weight:800;font-size:1rem;z-index:9999;text-align:center;box-shadow:0 6px 24px rgba(0,0,0,.6);pointer-events:none';
  el.innerHTML=`🏆 RECORDE PESSOAL!<div style="font-family:var(--mo);font-size:.8rem;margin-top:4px;color:#FFD080">${kg}kg${reps?' × '+reps+' reps':''}`;
  document.body.appendChild(el);
  setTimeout(()=>{el.style.cssText+=';opacity:0;transition:opacity .5s';setTimeout(()=>el.remove(),500);},2500);
}
// ── Streak (sequência de semanas) ──────────────────────────────
function calcStreak(){
  const weeks=new Set();
  DB.keys('workout:').forEach(k=>{const p=k.split(':');if(p.length===3){const log=DB.get(k);if(log&&Object.values(log).some(ex=>ex?.done))weeks.add(dateISO(mondayOf(new Date(p[1]+'T12:00:00'))));}});
  let n=0,ch=mondayOf(new Date());
  while(true){if(weeks.has(dateISO(ch))){n++;ch=new Date(ch);ch.setDate(ch.getDate()-7);}else break;}
  return n;
}
// ── Resumo semanal ─────────────────────────────────────────────
function weeklyStats(){
  function wd(mon){const end=new Date(mon);end.setDate(end.getDate()+6);const days=new Set();let sets=0;DB.keys('workout:').forEach(k=>{const p=k.split(':');if(p.length===3){const d=new Date(p[1]+'T12:00:00');if(d>=mon&&d<=end){const log=DB.get(k);if(log&&Object.values(log).some(ex=>ex?.done)){days.add(p[1]);Object.values(log).forEach(ex=>{if(ex?.sets)sets+=ex.sets.filter(s=>s.done).length;});}}}});return{workouts:days.size,sets};}
  const mon=mondayOf(new Date());const prev=new Date(mon);prev.setDate(prev.getDate()-7);
  return{cur:wd(mon),prev:wd(prev)};
}
// ── Gráfico de evolução de carga ───────────────────────────────
function exProgressChart(exId,dayId){
  const pts=[];
  DB.keys('workout:').filter(k=>k.endsWith(':'+dayId)).forEach(k=>{const log=DB.get(k);if(log&&log[exId]?.sets){const maxKg=Math.max(0,...log[exId].sets.filter(s=>s.done&&s.kg).map(s=>parseFloat(s.kg)||0));if(maxKg>0)pts.push({date:k.split(':')[1],kg:maxKg});}});
  pts.sort((a,b)=>a.date>b.date?1:-1);
  if(pts.length<2)return'';
  const maxKg=Math.max(...pts.map(p=>p.kg)),minKg=Math.min(...pts.map(p=>p.kg));
  const rng=maxKg-minKg||1;const n=pts.length;const W=100,H=38,Pd=4;
  const cx=i=>Pd+(i/(n-1))*(W-Pd*2),cy=kg=>H-Pd-((kg-minKg)/rng)*(H-Pd*2);
  const line=pts.map((p,i)=>`${i===0?'M':'L'}${cx(i).toFixed(1)} ${cy(p.kg).toFixed(1)}`).join(' ');
  const area=line+` L${cx(n-1).toFixed(1)} ${H} L${cx(0).toFixed(1)} ${H} Z`;
  return`<div style="padding:8px 12px 6px;border-top:1px solid var(--bd)"><div style="font-size:.65rem;font-weight:700;color:var(--tx2);letter-spacing:.06em;margin-bottom:6px">EVOLUÇÃO DE CARGA</div><svg viewBox="0 0 ${W} ${H}" style="width:100%;height:42px"><path d="${area}" fill="var(--ru)" opacity="0.12"/><path d="${line}" fill="none" stroke="var(--ru)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>${pts.map((p,i)=>`<circle cx="${cx(i).toFixed(1)}" cy="${cy(p.kg).toFixed(1)}" r="2.5" fill="${i===n-1?'var(--ru)':'var(--sf2)'}" stroke="var(--ru)" stroke-width="1.2"/>`).join('')}</svg><div style="display:flex;justify-content:space-between;font-family:var(--mo);font-size:.62rem;color:var(--tx2);margin-top:3px"><span>${pts[0].date.slice(5)}</span><span style="color:var(--ru);font-weight:700">Máx ${maxKg}kg</span><span>${pts[n-1].date.slice(5)}</span></div></div>`;
}

function calcAchievements(){
  const u=new Set();
  const days=new Set();
  DB.keys('workout:').forEach(k=>{const p=k.split(':');if(p.length===3){const log=DB.get(k);if(log&&Object.values(log).some(e=>e?.done))days.add(p[1]);}});
  if(days.size>=1)u.add('first_workout');
  if(days.size>=10)u.add('total_10');
  if(days.size>=50)u.add('total_50');
  if(DB.keys('pr:').length>0)u.add('first_pr');
  const sk=calcStreak();
  if(sk>=1)u.add('streak_1');if(sk>=3)u.add('streak_3');if(sk>=5)u.add('streak_5');if(sk>=10)u.add('streak_10');
  const ws=weeklyStats();
  if(ws.cur.sets>=50)u.add('sets_50week');
  if(ws.cur.workouts>=getGoals().workouts)u.add('goal_met');
  return u;
}

function exportCSV(){
  const rows=[['Data','Dia','Exercício','Série','Kg','Reps','Feito']];
  DB.keys('workout:').sort().forEach(k=>{
    const p=k.split(':');if(p.length!==3)return;
    const[,date,dayId]=p;const log=DB.get(k);if(!log)return;
    const day=DAYS.find(d=>d.id===dayId);
    Object.entries(log).forEach(([exId,entry])=>{
      const ex=(WORKOUTS[dayId]||[]).find(e=>e.id===exId);
      if(entry?.sets){entry.sets.forEach((s,i)=>{rows.push([date,day?.lb||dayId,ex?.n||exId,i+1,s.kg||'',s.reps||'',s.done?'Sim':'Não']);});}
      else if(entry?.done){rows.push([date,day?.lb||dayId,ex?.n||exId,1,entry.weight||'',entry.reps||'',entry.done?'Sim':'Não']);}
    });
  });
  const csv=rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n');
  const a=document.createElement('a');a.href='data:text/csv;charset=utf-8,﻿'+encodeURIComponent(csv);a.download='bulk-log-treinos.csv';document.body.appendChild(a);a.click();a.remove();
}

function _muscLoadWeek(){
  const now=new Date();const dow=now.getDay();
  const monOff=dow===0?6:dow-1;
  const load={};
  for(let i=0;i<=monOff;i++){
    const d=new Date(now);d.setDate(now.getDate()-i);
    const iso=d.toISOString().slice(0,10);
    DB.keys('workout:'+iso+':').forEach(k=>{
      const log=DB.get(k);if(!log)return;
      const dayId=k.split(':')[2];
      Object.entries(log).forEach(function(kv){
        const exId=kv[0],entry=kv[1];
        const sets=(entry.sets||[]).filter(function(s){return s.done;}).length;
        if(!sets)return;
        (EX_MUS[exId]||[]).forEach(function(g){
          load[g]=(load[g]||0)+sets;
        });
      });
    });
  }
  return load;
}
function _weekStart(){

function _muscLastDay(g){
  const keys=DB.keys('workout:').sort().reverse();
  for(let i=0;i<keys.length;i++){
    const log=DB.get(keys[i]);if(!log)continue;
    const dayId=keys[i].split(':')[2];
    const dateStr=keys[i].split(':')[1];
    const exIds=Object.keys(log).filter(function(id){return (log[id].sets||[]).some(function(s){return s.done;});});
    for(let j=0;j<exIds.length;j++){
      if((EX_MUS[exIds[j]]||[]).indexOf(g)>=0)return dateStr;
    }
  }
  return null;
}

function _mvGetCounts(){

  else if(per==='month'){const d=new Date(now);d.setDate(d.getDate()-30);cut=d.toISOString().slice(0,10);}
  else if(per==='3mo'){const d=new Date(now);d.setDate(d.getDate()-90);cut=d.toISOString().slice(0,10);}
  else cut='2000-01-01';
  const gc={};
  DB.keys('workout:').filter(k=>k.slice(8,18)>=cut).forEach(k=>{
    const log=DB.get(k)||{};
    Object.keys(log).forEach(exId=>{
      const s=(log[exId]?.sets||[]).filter(s=>s.done).length;

      if(!ud?.muscleId||ud.interactive===false)return;
      if(Array.isArray(obj.material))obj.material=obj.material.map(m=>m.clone());
      else obj.material=obj.material.clone();
      const mat=Array.isArray(obj.material)?obj.material[0]:obj.material;
      if(mat){mat.transparent=true;}
      _mvMeshes[ud.muscleId]={mesh:obj,ud,or:mat?.color?.r??0.8,og:mat?.color?.g??0.6,ob:mat?.color?.b??0.6,oa:mat?.opacity??1};
    });
    const gc=_mvGetCounts();_mvColorize(gc);
    if(S.muscSel&&_mvMeshes[S.muscSel])_mvSelect(S.muscSel,_mvMeshes[S.muscSel].ud);
    if(ov)ov.style.display='none';
    const ray=new THREE.Raycaster();const ptr=new THREE.Vector2();
    function onPick(cx,cy){
      const r=canvas.getBoundingClientRect();
      ptr.x=((cx-r.left)/r.width)*2-1;ptr.y=-((cy-r.top)/r.height)*2+1;
      ray.setFromCamera(ptr,_mvCam);
      const hits=ray.intersectObjects(Object.values(_mvMeshes).map(m=>m.mesh),false);
      if(hits.length){
        const obj=hits[0].object;
        const ud=obj.userData?.muscleId?obj.userData:(obj.parent?.userData||{});
        if(ud.muscleId&&ud.interactive!==false){_mvSelect(ud.muscleId,ud);return;}
      }
      S.muscSel=null;_mvDesel();const inf=document.getElementById('mv-info');if(inf)inf.style.display='none';
    }
    let _mvPD=null;
    canvas.addEventListener('pointerdown',e=>{_mvPD={x:e.clientX,y:e.clientY};});
    canvas.addEventListener('pointerup',e=>{if(!_mvPD)return;const dx=e.clientX-_mvPD.x,dy=e.clientY-_mvPD.y;_mvPD=null;if(Math.sqrt(dx*dx+dy*dy)<8)onPick(e.clientX,e.clientY);});
    const loop=()=>{if(mid!==_mvMountId)return;_mvRaf=requestAnimationFrame(loop);_mvCtrls.update();_mvRenderer.render(_mvScene,_mvCam);};loop();
  }catch(err){
    console.error('MuscleViewer:',err);
    if(ov)ov.innerHTML='<div style="color:var(--tx2);font-size:.82rem;text-align:center;padding:24px">Erro ao carregar modelo 3D.<br><button onclick="_mvInit()" style="margin-top:10px;padding:8px 20px;background:#C45A1A;color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:.84rem">Tentar novamente</button></div>';
  }
}

function _dUid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,5);}
function _dietPlans(){return DB.get('diet:plans')||[];}
function _dietPlan(id){return DB.get('diet:plan:'+id)||null;}
function _dietLog(iso){return DB.get('diet:log:'+iso)||{};}
function _dietSaveLog(iso,log){DB.set('diet:log:'+iso,log);}
function _dietActivePlan(iso){
  const plans=_dietPlans().filter(p=>!p.archived&&p.active);
  if(!plans.length){const all=_dietPlans().filter(p=>!p.archived);return all.length?_dietPlan(all[0].id):null;}
  const dow=['sun','mon','tue','wed','thu','fri','sat'][new Date(iso+'T12:00:00').getDay()];
  const m=plans.find(p=>{const pl=_dietPlan(p.id);return pl&&pl.dayAssign&&pl.dayAssign[dow];});
  if(m)return _dietPlan(m.id);
  const fallback=plans[0];return fallback?_dietPlan(fallback.id):null;
}
function _macroCalc(foods){
  let kc=0,pt=0,cb=0,ft=0,fb=0;
  (foods||[]).forEach(f=>{
    const r=(f.qty||0)/100;
    kc+=(f.k||0)*r;pt+=(f.p||0)*r;cb+=(f.c||0)*r;ft+=(f.f||0)*r;fb+=(f.fb||0)*r;
  });
  return{kcal:Math.round(kc),prot:Math.round(pt*10)/10,carb:Math.round(cb*10)/10,fat:Math.round(ft*10)/10,fiber:Math.round(fb*10)/10};
}
function _dObjName(id){return(DIET_OBJ.find(o=>o.id===id)||{name:id||'—'}).name;}
function _dDowOf(iso){return['sun','mon','tue','wed','thu','fri','sat'][new Date(iso+'T12:00:00').getDay()];}

function renderDieta(){
  const iso=S.dietDay||todayISO();
  const today=todayISO();

    <button class="diet-create-btn" data-diet-new>+ CRIAR DIETA</button>

  }
  // Macros

    mealsTotal++;

      mealsDone++;
      const mc=_macroCalc(ml.consumed&&ml.consumed.length?ml.consumed:m.foods);
      tot.kcal+=mc.kcal;tot.prot+=mc.prot;tot.carb+=mc.carb;tot.fat+=mc.fat;tot.fiber+=mc.fiber;

  });
  const _pct=(v,g)=>Math.min(100,g>0?Math.round(v/g*100):0);

  const macroHtml=`<div class="diet-macros">

      <div class="diet-macro-lbl">prot</div>
      <div class="diet-macro-bar"><div class="diet-macro-fill" style="width:${_pct(tot.prot,goals.prot)}%;background:var(--ol)"></div></div>
      <div style="font-size:.52rem;color:var(--tx2);margin-top:3px">/ ${goals.prot}g</div>
    </div>
    <div class="diet-macro-card">
      <div class="diet-macro-val">${tot.carb}g</div>
      <div class="diet-macro-lbl">carb</div>
      <div class="diet-macro-bar"><div class="diet-macro-fill" style="width:${_pct(tot.carb,goals.carb)}%;background:#4A7AB8"></div></div>
      <div style="font-size:.52rem;color:var(--tx2);margin-top:3px">/ ${goals.carb}g</div>
    </div>
    <div class="diet-macro-card">
      <div class="diet-macro-val">${tot.fat}g</div>
      <div class="diet-macro-lbl">gord</div>
      <div class="diet-macro-bar"><div class="diet-macro-fill" style="width:${_pct(tot.fat,goals.fat)}%;background:#E8A030"></div></div>
      <div style="font-size:.52rem;color:var(--tx2);margin-top:3px">/ ${goals.fat}g</div>
    </div>
  </div>`;
  // Plan header
  const planHdr=`<div class="diet-plan-hdr">
    <div class="diet-plan-name">${plan.name}</div>
    <div style="display:flex;align-items:center;justify-content:space-between">
      <div style="font-size:.67rem;color:var(--tx2);font-weight:600;text-transform:uppercase;letter-spacing:.05em">${_dObjName(plan.objective)}</div>
      <div style="font-size:.67rem;color:var(--tx2)">${mealsDone}/${mealsTotal} refeições ✓</div>
    </div>
  </div>`;
  // Meal cards
  const mealCards=(plan.meals||[]).map(m=>{
    const ml=log.meals?.[m.id]||{};
    const isDone=ml.status==='done',isPartial=ml.status==='partial',isSkip=ml.status==='skip';
    const foods=m.foods||[];
    const planned=_macroCalc(foods);
    const foodRows=foods.slice(0,4).map(f=>`<div class="diet-food-row">
      <span class="diet-food-nm">${f.name}</span>
      <span class="diet-food-qty">${f.qty}${f.unit||'g'}</span>
      <span class="diet-food-kcal">${Math.round((f.k||0)*f.qty/100)} kcal</span>
    </div>`).join('');
    const more=foods.length>4?`<div style="font-size:.65rem;color:var(--tx2);padding:4px 0">+${foods.length-4} alimento${foods.length-4>1?'s':''}</div>`:'';
    const stBtn=`<button class="diet-meal-status-btn${isDone?' done':isPartial?' partial':''}" data-diet-meal-cycle="${m.id}" data-diet-plan="${plan.id}" title="${isDone?'Feita':isPartial?'Parcial':isSkip?'Pulada':'Marcar como feita'}">${isDone?'✓':isPartial?'½':isSkip?'✕':'○'}</button>`;
    return`<div class="diet-meal-card${isDone?' done':''}" id="dmc-${m.id}">
      <div class="diet-meal-head">
        <div class="diet-meal-icon">${m.ico||'🍽️'}</div>
        <div class="diet-meal-info">
          <div class="diet-meal-name">${m.name}${isSkip?' <span style="font-size:.6rem;color:var(--tx2)">(pulada)</span>':''}</div>

  };
  const entry=map[m]||{t:'Dieta',fn:()=>''};

  // vincular busca de alimento ao input
  const si=document.getElementById('diet-food-q');

  // vincular quantidade ao cálculo em tempo real
  const qi=document.getElementById('diet-qty-inp');

function _updateQtyMacros(){
  const f=S.dietQtyFood;if(!f)return;
  const qi=document.getElementById('diet-qty-inp');const qu=document.getElementById('diet-qty-unit');
  if(!qi)return;
  const qty=parseFloat(qi.value)||0;
  // convert unit to grams for macro calc
  const unit=qu?qu.value:'g';
  let grams=qty;
  if(unit==='kg')grams=qty*1000;
  else if(unit==='ml')grams=qty;
  else if(unit==='un'){grams=qty*(f.gPerUnit||100);}
  else if(unit==='fatia')grams=qty*(f.gPerSlice||30);
  else if(unit==='col')grams=qty*15;
  else if(unit==='xic')grams=qty*240;
  else if(unit==='scoop')grams=qty*(f.gPerScoop||30);
  else if(unit==='porcao')grams=qty*(f.gPerPorcao||100);
  const r=grams/100;
  const setM=(id,v)=>{const el=document.getElementById(id);if(el)el.textContent=v;};
  setM('qty-mv-kcal',Math.round((f.k||0)*r));
  setM('qty-mv-prot',Math.round((f.p||0)*r*10)/10+'g');
  setM('qty-mv-carb',Math.round((f.c||0)*r*10)/10+'g');
  setM('qty-mv-fat',Math.round((f.f||0)*r*10)/10+'g');
}

// ── Wizard ────────────────────────────────────────────────────────────────────
function _wizBar(cur,total){
  return`<div class="diet-wiz-bar">${Array.from({length:total},(_,i)=>`<div class="diet-wiz-step ${i<cur-1?'done':i===cur-1?'cur':''}"></div>`).join('')}</div>`;
}
function _renderWizard(){
  const d=S.dietWizData||{};
  const step=S.dietWizStep;
  const bar=_wizBar(step,5);
  if(step===1){
    const objBtns=DIET_OBJ.map(o=>`<button class="diet-obj-btn${d.objective===o.id?' sel':''}" data-wiz-obj="${o.id}">
      <div class="diet-obj-ico">${o.ico}</div>
      <div class="diet-obj-nm">${o.name}</div>
    </button>`).join('');
    return bar+`<div class="diet-wiz-label">Nome da dieta</div>
    <input class="diet-wiz-inp" id="wiz-name" placeholder="Ex: Dieta Ganho de Massa" value="${(d.name||'').replace(/"/g,'&quot;')}">
    <div class="diet-wiz-label">Objetivo</div>
    <div class="diet-obj-grid">${objBtns}</div>
    <div class="diet-wiz-nav"><button class="diet-wiz-btn" style="background:var(--ru);color:#fff" data-wiz-next>Próximo →</button></div>`;
  }
  if(step===2){
    const days=d.days||{mon:true,tue:true,wed:true,thu:true,fri:true};
    const dayBtns=DIET_WEEK.map(w=>`<button class="diet-wiz-day${days[w.id]?' sel':''}" data-wiz-day="${w.id}">${w.s}</button>`).join('');
    return bar+`<div class="diet-wiz-label">Dias da semana</div>
    <div class="diet-day-grid">${dayBtns}</div>
    <div style="font-size:.72rem;color:var(--tx2);margin-bottom:12px">Selecione os dias em que esta dieta será aplicada. Você pode ter dietas diferentes para dias de treino e descanso.</div>
    <div class="diet-wiz-nav">
      <button class="diet-wiz-btn" style="background:var(--sf);color:var(--tx)" data-wiz-back>← Voltar</button>
      <button class="diet-wiz-btn" style="background:var(--ru);color:#fff" data-wiz-next>Próximo →</button>
    </div>`;
  }
  if(step===3){
    const sel=d.meals||['cafe','almoco','jantar'];
    const mealList=DIET_MEAL_TYPES.map(m=>`<button class="diet-meal-sel-item${sel.includes(m.id)?' sel':''}" data-wiz-meal="${m.id}">
      <span class="diet-meal-sel-ico">${m.ico}</span>
      <span class="diet-meal-sel-nm">${m.name}</span>
      <span class="diet-meal-sel-chk">${sel.includes(m.id)?'✓':''}</span>
    </button>`).join('');
    return bar+`<div class="diet-wiz-label">Refeições</div>
    <div class="diet-meal-sel-list">${mealList}</div>
    <div class="diet-wiz-nav">
      <button class="diet-wiz-btn" style="background:var(--sf);color:var(--tx)" data-wiz-back>← Voltar</button>
      <button class="diet-wiz-btn" style="background:var(--ru);color:#fff" data-wiz-next>Próximo →</button>
    </div>`;
  }
  if(step===4){
    const g=d.goals||{};
    return bar+`<div class="diet-wiz-label">Metas nutricionais (opcional)</div>
    <div style="font-size:.72rem;color:var(--tx2);margin-bottom:12px">Informe suas metas ou deixe em branco para não definir. Estes valores são estimativas — consulte um nutricionista para valores precisos.</div>
    <div class="diet-goals-grid">
      <div class="diet-goal-item"><div class="diet-goal-lbl">Calorias (kcal)</div><input class="diet-goal-inp" id="wiz-g-kcal" type="number" inputmode="numeric" placeholder="Ex: 2500" value="${g.kcal||''}"></div>
      <div class="diet-goal-item"><div class="diet-goal-lbl">Proteína (g)</div><input class="diet-goal-inp" id="wiz-g-prot" type="number" inputmode="numeric" placeholder="Ex: 150" value="${g.prot||''}"></div>
      <div class="diet-goal-item"><div class="diet-goal-lbl">Carboidrato (g)</div><input class="diet-goal-inp" id="wiz-g-carb" type="number" inputmode="numeric" placeholder="Ex: 300" value="${g.carb||''}"></div>
      <div class="diet-goal-item"><div class="diet-goal-lbl">Gordura (g)</div><input class="diet-goal-inp" id="wiz-g-fat" type="number" inputmode="numeric" placeholder="Ex: 70" value="${g.fat||''}"></div>
    </div>
    <div class="diet-wiz-nav">
      <button class="diet-wiz-btn" style="background:var(--sf);color:var(--tx)" data-wiz-back>← Voltar</button>
      <button class="diet-wiz-btn" style="background:var(--ru);color:#fff" data-wiz-next>Próximo →</button>
    </div>`;
  }
  if(step===5){
    const days=d.days||{};
    const selDays=DIET_WEEK.filter(w=>days[w.id]).map(w=>w.l).join(', ')||'Nenhum';
    const selMeals=DIET_MEAL_TYPES.filter(m=>(d.meals||[]).includes(m.id)).map(m=>m.name).join(', ')||'Nenhuma';
    const g=d.goals||{};
    return bar+`<div class="diet-wiz-label">Revisão</div>
    <div class="diet-review-block"><div class="diet-review-lbl">Nome</div><div class="diet-review-val">${d.name||'—'}</div></div>
    <div class="diet-review-block"><div class="diet-review-lbl">Objetivo</div><div class="diet-review-val">${_dObjName(d.objective)}</div></div>
    <div class="diet-review-block"><div class="diet-review-lbl">Dias</div><div class="diet-review-val">${selDays}</div></div>
    <div class="diet-review-block"><div class="diet-review-lbl">Refeições</div><div class="diet-review-val">${selMeals}</div></div>
    ${g.kcal?`<div class="diet-review-block"><div class="diet-review-lbl">Metas</div><div class="diet-review-val">${g.kcal} kcal · ${g.prot||'—'}g prot · ${g.carb||'—'}g carb · ${g.fat||'—'}g gord</div></div>`:''}
    <div style="font-size:.7rem;color:var(--tx2);margin-bottom:14px;line-height:1.5">Após criar, você poderá adicionar alimentos a cada refeição. Os valores são para acompanhamento pessoal e não substituem orientação profissional.</div>
    <div class="diet-wiz-nav">
      <button class="diet-wiz-btn" style="background:var(--sf);color:var(--tx)" data-wiz-back>← Voltar</button>
      <button class="diet-wiz-btn" style="background:var(--ol);color:#fff" data-wiz-finish>✓ Criar dieta</button>
    </div>`;
  }
  return '';
}
function _wizSaveStep(){
  const d=S.dietWizData||{};
  const step=S.dietWizStep;
  if(step===1){
    const nm=document.getElementById('wiz-name')?.value.trim();
    if(!nm){alert('Informe o nome da dieta.');return false;}
    if(!d.objective){alert('Selecione o objetivo.');return false;}
    d.name=nm;
  }
  if(step===2){
    const days=d.days||{};
    if(!Object.values(days).some(Boolean)){alert('Selecione ao menos um dia.');return false;}
  }
  if(step===3){
    if(!(d.meals||[]).length){alert('Selecione ao menos uma refeição.');return false;}
  }
  if(step===4){
    const g={};
    ['kcal','prot','carb','fat'].forEach(k=>{const v=parseInt(document.getElementById('wiz-g-'+k)?.value)||0;if(v>0)g[k]=v;});
    d.goals=g;
  }
  S.dietWizData=d;
  return true;
}
function _wizFinish(){
  const d=S.dietWizData;if(!d)return;
  const planId=_dUid();
  const meals=DIET_MEAL_TYPES.filter(m=>(d.meals||[]).includes(m.id)).map(m=>({...m,id:_dUid(),typeId:m.id,foods:[]}));
  const plan={id:planId,name:d.name,objective:d.objective||'personalizado',goals:d.goals||{},dayAssign:d.days||{},meals,createdAt:todayISO(),active:true};
  DB.set('diet:plan:'+planId,plan);
  const plans=_dietPlans();
  // desativar planos que conflitem nos mesmos dias
  plans.forEach(p=>{if(p.active&&p.id!==planId){const pl=_dietPlan(p.id);if(!pl)return;const conflict=Object.keys(d.days||{}).some(dk=>d.days[dk]&&pl.dayAssign?.[dk]);if(conflict){p.active=false;}}});
  plans.push({id:planId,name:d.name,objective:d.objective,active:true,createdAt:todayISO()});
  DB.set('diet:plans',plans);
  closeDietOv();
  S.dietWizData=null;S.dietWizStep=1;
  remountContent();
}

  const cards=plans.map(p=>{
    const pl=_dietPlan(p.id);
    const days=pl?DIET_WEEK.filter(w=>pl.dayAssign?.[w.id]).map(w=>w.s).join(', '):'';
    const meals=pl?pl.meals.length:0;
    return`<div class="diet-plan-card${p.active?' active-plan':''}">
      <div class="diet-plan-card-name">${p.active?'✦ ':''}${p.name}</div>
      <div class="diet-plan-card-meta">${_dObjName(p.objective)}${days?' · '+days:''} · ${meals} refeição${meals!==1?'ões':''} · criada ${p.createdAt}</div>

// ── Shopping List ─────────────────────────────────────────────────────────────
function _renderShopping(){
  const iso=S.dietDay||todayISO();
  const plan=_dietActivePlan(iso);
  let allFoods=[];
  if(plan){
    // Agrupa alimentos de todas as refeições
    (plan.meals||[]).forEach(m=>{(m.foods||[]).forEach(f=>{
      const ex=allFoods.find(a=>a.id===f.id);
      if(ex)ex.qty+=f.qty;
      else allFoods.push({...f,qty:f.qty||0});
    });});
  }
  const shopKey='diet:shopping:'+iso.slice(0,7);
  const shop=DB.get(shopKey)||{checked:{}};
  // Group by category
  const byCat={};
  allFoods.forEach(f=>{const c=f.cat||'outros';if(!byCat[c])byCat[c]=[];byCat[c].push(f);});
  const catNames={carnes:'🥩 Carnes',peixes:'🐟 Peixes',ovos:'🥚 Ovos',laticinios:'🥛 Laticínios',cereais:'🌾 Cereais',leguminosas:'🫘 Leguminosas',frutas:'🍎 Frutas',verduras:'🥦 Verduras e legumes',tuberculos:'🥔 Tubérculos',paes:'🍞 Pães',oleaginosas:'🥜 Oleaginosas',suplementos:'💪 Suplementos',bebidas:'🥤 Bebidas',gorduras:'🫒 Gorduras',doces:'🍯 Doces',outros:'📦 Outros'};
  if(!allFoods.length)return`<div style="text-align:center;padding:30px 0;color:var(--tx2);font-size:.82rem">Nenhum alimento na dieta ativa.<br>Crie ou edite uma dieta primeiro.</div>`;
  const html=Object.entries(byCat).map(([cat,foods])=>`<div class="diet-shop-cat">${catNames[cat]||cat}</div>`+foods.map(f=>`<div class="diet-shop-item">
    <button class="diet-shop-chk${shop.checked?.[f.id]?' done':''}" data-shop-check="${f.id}">${shop.checked?.[f.id]?'✓':''}</button>
    <span class="diet-shop-nm">${f.name}</span>
    <span class="diet-shop-qty">${Math.round(f.qty)}${f.unit||'g'}</span>
  </div>`).join('')).join('');
  return`<div style="font-size:.72rem;color:var(--tx2);margin-bottom:12px">Alimentos da dieta ativa esta semana. Toque para marcar como comprado.</div>
  ${html}`;
}

function _lastSetsOf(exId,dayId){
  const keys=DB.keys('workout:').filter(function(k){return k.endsWith(':'+dayId);}).sort().reverse();
  if(!keys.length)return '';
  const log=DB.get(keys[0])||{};
  const sets=((log[exId]||{}).sets||[]).filter(function(s){return s.done;});
  if(!sets.length)return '';
  const date=keys[0].split(':')[1];
  return '<div style="font-size:.68rem;color:var(--tx2);margin-top:5px;padding-top:5px;border-top:1px solid var(--bd)">'
    +'<span style="font-weight:700">'+date.slice(5)+':</span> '
    +sets.map(function(s){return(s.kg||'—')+'kg×'+(s.reps||'—');}).join(' · ')
    +'</div>';
}
function openDayLog(iso,dayId){
  const log=DB.get('workout:'+iso+':'+dayId)||{};
  const exs=WORKOUTS[dayId]||[];
  const dt=new Date(iso+'T12:00:00');
  const dlbl=dt.toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long',year:'numeric'});
  document.getElementById('day-log-title').textContent=dlbl.charAt(0).toUpperCase()+dlbl.slice(1);
  let html='';
  exs.forEach(function(ex){
    const entry=log[ex.id];if(!entry)return;
    const sets=(entry.sets||[]).filter(function(s){return s.done;});
    if(!sets.length)return;
    html+='<div class="day-log-ex">'
      +'<div class="day-log-ex-nm">'+ex.n+'</div>'
      +sets.map(function(s,i){
        return '<div class="day-log-set">'+(i+1)+'. '+(s.kg||'—')+' kg × '+(s.reps||'—')+' reps'+(s.comment?' — '+s.comment:'')+' </div>';
      }).join('')
      +'</div>';
  });
  if(!html)html='<p style="color:var(--tx2);font-size:.85rem;text-align:center;padding-top:20px">Sem séries registradas.</p>';
  document.getElementById('day-log-body').innerHTML=html;
  document.getElementById('day-log-sheet').classList.add('open');
}

function renderProgresso(){
  const tab=S.progTab||'cargas';
  const tabNav='<div class="prog-tabs">'
    +'<button class="prog-tab'+(tab==='cargas'?' active':'')+'" data-prog-tab="cargas">Cargas</button>'
    +'<button class="prog-tab'+(tab==='corpo'?' active':'')+'" data-prog-tab="corpo">Corpo</button>'
    +'<button class="prog-tab'+(tab==='conquistas'?' active':'')+'" data-prog-tab="conquistas">Conquistas</button>'
    +'</div>';
  let body='';
  if(tab==='cargas'){
    const _evoPer=S.evoPeriod||'30d';
    const _evoCutoff=(()=>{const d=new Date();if(_evoPer==='7d')d.setDate(d.getDate()-7);else if(_evoPer==='30d')d.setDate(d.getDate()-30);else if(_evoPer==='3mo')d.setMonth(d.getMonth()-3);else if(_evoPer==='6mo')d.setMonth(d.getMonth()-6);else if(_evoPer==='1yr')d.setFullYear(d.getFullYear()-1);else{d.setFullYear(2000);}return d.toISOString().slice(0,10);})();
    // Collect all workout sessions in period
    const _allWkKeys=DB.keys('workout:').filter(k=>{const _d=k.split(':')[1];return _d>=_evoCutoff;});
    let _totWk=0,_totSets=0,_totReps=0,_totVol=0,_totDurS=0,_wkDays=new Set();
    const _muscCounts={};let _maxPR=null,_prCount=0;
    const _byWeek={};
    _allWkKeys.forEach(k=>{
      const parts=k.split(':');const _iso=parts[1],_day=parts[2];
      if(!_iso||!_day)return;
      _wkDays.add(_iso+':'+_day);
      const _wkn=new Date(_iso+'T12:00:00');const _wnum=Math.floor(_wkn.getTime()/(7*86400000));
      if(!_byWeek[_wnum])_byWeek[_wnum]={vol:0,sets:0};
      const log=DB.get(k)||{};
      Object.keys(log).forEach(exId=>{
        const ent=log[exId];if(!ent)return;
        (ent.sets||[]).filter(s=>s.done).forEach(s=>{
          _totSets++;_totReps+=parseInt(s.reps)||0;
          const vol=(parseFloat(s.kg)||0)*(parseInt(s.reps)||0);
          _totVol+=vol;_byWeek[_wnum].vol+=vol;_byWeek[_wnum].sets++;
          (EX_MUS[exId]||[]).forEach(g=>{_muscCounts[g]=(_muscCounts[g]||0)+1;});
        });
      });
    });
    _totWk=_wkDays.size;
    // PRs
    const _prList=[];
    const _allExIds=[...new Set(Object.values(WORKOUTS).flat().map(e=>e.id))];
    _allExIds.forEach(exId=>{const pr=getPR(exId);if(pr){_prList.push({exId,pr});_prCount++;}});
    _prList.sort((a,b)=>b.pr.kg-a.pr.kg);
    // Muscle progression index: compare first half vs second half of period
    const _halfCut=(()=>{const s=new Date(_evoCutoff),e=new Date();const mid=new Date((s.getTime()+e.getTime())/2);return mid.toISOString().slice(0,10);})();
    const _muscFirst={},_muscSecond={};
    DB.keys('workout:').filter(k=>{const _d=k.split(':')[1];return _d>=_evoCutoff;}).forEach(k=>{
      const _d=k.split(':')[1];const log=DB.get(k)||{};const bucket=_d<_halfCut?_muscFirst:_muscSecond;
      Object.keys(log).forEach(exId=>{(EX_MUS[exId]||[]).forEach(g=>{if(!bucket[g])bucket[g]={vol:0,n:0};const sets=(log[exId]?.sets||[]).filter(s=>s.done);sets.forEach(s=>{bucket[g].vol+=(parseFloat(s.kg)||0)*(parseInt(s.reps)||0);bucket[g].n++;});});});
    });
    const _muscIdx={};Object.keys({..._muscFirst,..._muscSecond}).forEach(g=>{const f=_muscFirst[g]||{vol:0,n:1};const s=_muscSecond[g]||{vol:0,n:1};const fa=f.vol/(f.n||1),sa=s.vol/(s.n||1);if(fa>0)_muscIdx[g]=Math.round((sa-fa)/fa*100);});
    // Periods bar
    const _periods=[{id:'7d',lb:'7 dias'},{id:'30d',lb:'30 dias'},{id:'3mo',lb:'3 meses'},{id:'6mo',lb:'6 meses'},{id:'1yr',lb:'1 ano'},{id:'all',lb:'Sempre'}];
    const periodBar='<div class="evo-period-scrl">'+_periods.map(p=>`<button class="evo-period-btn${_evoPer===p.id?' sel':''}" data-evo-period="${p.id}">${p.lb}</button>`).join('')+'</div>';
    // Stat cards
    const _fmtVol=v=>v>=1000?Math.round(v/100)/10+'t':Math.round(v)+'kg';
    const _wkFreq=Object.keys(_byWeek).length>0?Math.round(_totWk/Math.max(1,Object.keys(_byWeek).length)*10)/10:0;
    const _topPR=_prList[0];
    const cards='<div class="evo-cards-grid">'
      +`<div class="evo-card"><div class="evo-card-val">${_totWk}</div><div class="evo-card-lbl">Treinos<br>realizados</div></div>`
      +`<div class="evo-card"><div class="evo-card-val">${_totSets}</div><div class="evo-card-lbl">Séries<br>totais</div></div>`
      +`<div class="evo-card"><div class="evo-card-val">${_totReps.toLocaleString('pt-BR')}</div><div class="evo-card-lbl">Repetições<br>totais</div></div>`
      +`<div class="evo-card"><div class="evo-card-val">${_fmtVol(_totVol)}</div><div class="evo-card-lbl">Volume<br>levantado</div></div>`
      +`<div class="evo-card"><div class="evo-card-val">${_wkFreq}x</div><div class="evo-card-lbl">Freq. por<br>semana</div></div>`
      +`<div class="evo-card"><div class="evo-card-val">${_prCount}</div><div class="evo-card-lbl">PRs<br>registrados</div></div>`
      +(_topPR?`<div class="evo-card wide"><div class="evo-card-val" style="font-size:1.1rem">🏆 ${_topPR.pr.kg}kg</div><div class="evo-card-lbl">Maior PR: ${(Object.values(WORKOUTS).flat().find(e=>e.id===_topPR.exId)||{n:_topPR.exId}).n||_topPR.exId}</div><div class="evo-card-sub">${_topPR.pr.reps||0} reps · ${_topPR.pr.date||''}</div></div>`:'')      +'</div>';
    // Weekly volume chart (canvas)
    const _weeks=Object.keys(_byWeek).sort().slice(-12);
    const _weekVols=_weeks.map(w=>_byWeek[w]?.vol||0);
    const _maxWV=Math.max(1,..._weekVols);
    const _wkChart=`<div class="evo-chart-wrap"><div class="evo-chart-title">Volume semanal</div><div class="evo-chart-sub">Últimas ${_weeks.length} semanas · Pico: ${_fmtVol(_maxWV)}</div><canvas class="evo-canvas" id="evo-vol-canvas" height="120" style="width:100%"></canvas></div>`;
    // Exercise progression select
    const _exsWithData=Object.values(WORKOUTS).flat().filter(ex=>{const keys=DB.keys('workout:').filter(k=>k.includes(':'+ex.id.charAt(0)));return DB.keys('workout:').some(k=>{const l=DB.get(k);return l&&l[ex.id]?.sets?.some(s=>s.done);});});
    const _selExId=S.evoSelEx||(_exsWithData[0]?.id||'');
    const _selDayId=Object.keys(WORKOUTS).find(d=>(WORKOUTS[d]||[]).some(e=>e.id===_selExId))||S.treinoDay||'mon';
    const _exSelect='<div class="evo-chart-wrap"><div class="evo-chart-title">Progressão de Carga</div><select class="evo-ex-sel" id="evo-ex-sel">'+Object.values(WORKOUTS).flat().map(ex=>`<option value="${ex.id}:${Object.keys(WORKOUTS).find(d=>WORKOUTS[d].some(e=>e.id===ex.id))||'mon'}" ${ex.id===_selExId?'selected':''}>${ex.n}</option>`).join('')+'</select><canvas class="evo-canvas" id="evo-load-canvas" height="140" style="width:100%"></canvas></div>';
    // PRs table
    const _prTable='<div class="evo-chart-wrap"><div class="evo-chart-title">PRs Registrados</div>'+(_prList.length?_prList.slice(0,10).map(({exId,pr})=>{const exN=(Object.values(WORKOUTS).flat().find(e=>e.id===exId)||{n:exId}).n||exId;return`<div class="evo-pr-row"><span class="evo-pr-ex">${exN}</span><span class="evo-pr-val">${pr.kg}kg</span><span class="evo-pr-date">${pr.reps||0}× · ${pr.date||''}</span></div>`;}).join(''):'<p style="color:var(--tx2);font-size:.78rem;padding:8px 0">Nenhum PR ainda. Registre treinos com peso!</p>')+'</div>';
    // Muscle progression index
    const _muscSorted=Object.entries(_muscIdx).sort((a,b)=>b[1]-a[1]);
    const _muscProg=_muscSorted.length?'<div class="evo-chart-wrap"><div class="evo-chart-title">Índice de Progressão Muscular</div><div class="evo-chart-sub">Variação do volume médio (1ª → 2ª metade do período)</div>'+_muscSorted.map(([g,pct])=>{const col=pct>=0?'#6B9E52':'#C45A1A';const barW=Math.min(100,Math.abs(pct));return`<div class="evo-mus-bar-row"><span class="evo-mus-bar-lbl">${MLBL[g]||g}</span><div class="evo-mus-bar-track"><div class="evo-mus-bar-fill" style="width:${barW}%;background:${col}"></div></div><span class="evo-mus-bar-val" style="color:${col}">${pct>=0?'+':''}${pct}%</span></div>`;}).join('')+'</div>':''
    body=periodBar+cards+_wkChart+_exSelect+_prTable+_muscProg;
    // Canvas drawing deferred to next tick
    S._evoCanvasData={weeks:_weeks,weekVols:_weekVols,maxWV:_maxWV,selExId:_selExId,selDayId:_selDayId};
    requestAnimationFrame(_drawEvoCharts);
  }
  else if(tab==='corpo'){
    const entries=DB.get('weight-log')||[];
    const maxW=Math.max.apply(null,entries.map(function(e){return e.weight;}).concat([0]));
    const minW=Math.min.apply(null,entries.map(function(e){return e.weight;}).concat([maxW]));
    const range=maxW-minW||1;
    let chartHtml='';
    if(entries.length>0){
      const last=entries.slice(-14);
      const bars=last.map(function(e,i){
        const h=((e.weight-minW)/range)*82+14;
        return '<div style="flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%">'
          +'<div style="width:70%;margin:0 auto;height:'+h+'%;background:'+(i===last.length-1?'#C45A1A':'#263040')+';border-radius:3px 3px 0 0"></div></div>';
      }).join('');
      chartHtml='<div class="chart-wrap"><div class="chart-bars">'+bars+'</div>'
        +'<div style="display:flex;justify-content:space-between;margin-top:8px">'
        +'<span style="font-family:var(--mo);font-size:.67rem;color:var(--tx2)">'+entries[Math.max(0,entries.length-14)].date.slice(5)+'</span>'
        +'<span style="font-family:var(--mo);font-size:.67rem;color:var(--tx2)">'+entries[entries.length-1].date.slice(5)+'</span>'
        +'</div></div>';
    }else{
      chartHtml='<div class="card empty-s">'+ico('trend',28,'#7A8898')+'<p class="dim" style="font-size:.85rem;margin-top:8px">Nenhum registro ainda</p></div>';
    }
    const logRows=[].concat(entries).reverse().slice(0,8).map(function(e){
      return '<div class="wlog-row"><span class="wlog-date">'+e.date+'</span><span class="wlog-val mono">'+e.weight+' kg</span></div>';
    }).join('');
    const lastMed=getLastMedidas();
    const medInputs=MEDIDAS_CAMPOS.map(function(c){
      const val=lastMed&&lastMed.data&&lastMed.data[c.id]?lastMed.data[c.id]:'';
      return '<div><div class="med-lbl">'+c.lb+' ('+c.un+')</div><input class="med-inp" id="mi-'+c.id+'" type="number" inputmode="decimal" placeholder="\u2014" value="'+val+'"></div>';
    }).join('');
    const medKeys=DB.keys('medidas:').sort().reverse();
    const medLog=medKeys.slice(0,4).map(function(k){
      const d=DB.get(k);
      const flds=MEDIDAS_CAMPOS.filter(function(c){return d[c.id];}).map(function(c){return c.lb+': '+d[c.id];}).join(' \u00b7 ');
      return '<div class="med-log-row">'
        +'<span style="font-size:.72rem;color:var(--tx2);flex-shrink:0">'+k.slice(8)+'</span>'
        +'<span style="font-size:.68rem;flex:1;padding-left:8px;text-align:right;color:var(--tx2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+flds+'</span></div>';
    }).join('');
    const medDateLbl=lastMed?'<span style="font-size:.68rem;color:var(--tx2)">'+lastMed.date+'</span>':'';
    const medSaveMargin=medLog?'0':'14px';
    const medidasSection='<div class="sec-head"><span class="sec-title">Medidas Corporais</span>'+medDateLbl+'</div>'
      +'<div class="med-grid">'+medInputs+'</div>'
      +'<button data-save-medidas style="width:100%;padding:10px;border-radius:8px;background:var(--sf2);border:1px solid var(--bd);color:var(--tx);font-weight:700;font-size:.82rem;margin-bottom:'+medSaveMargin+'">Salvar medidas</button>'
      +(medLog?'<div style="margin:6px 0 14px">'+medLog+'</div>':'');
    body='<div class="w-row"><input class="w-in" id="w-input" type="number" inputmode="decimal" placeholder="Peso hoje (kg)" value="'+S.wInput+'">'
      +'<button class="w-add" data-add-weight>'+ico('plus',20,'#E8E4DC')+'</button></div>'
      +chartHtml+logRows+medidasSection+renderPhotos();
  }
  else if(tab==='conquistas'){
    const unlocked=calcAchievements();
    const achItems=ACHVS.map(function(a){
      const on=unlocked.has(a.id);
      return '<div class="achv-item'+(on?' unlocked':' locked')+'">'
        +'<div class="achv-icon">'+a.icon+'</div>'
        +'<div class="achv-nm">'+a.name+'</div>'
        +'<div class="achv-desc">'+a.desc+'</div></div>';
    }).join('');
    body='<div class="sec-head"><span class="sec-title">Conquistas</span>'
      +'<span style="font-size:.72rem;color:var(--tx2)">'+unlocked.size+'/'+ACHVS.length+'</span></div>'
      +'<div class="achv-grid">'+achItems+'</div>';
  }
  return '<div style="padding:20px 0 14px"><div class="h2">Progresso</div></div>'
    +tabNav+body
    +'<button data-export-csv class="exp-btn">'+ico('download',16,'#7A8898')+' Exportar treinos (CSV)</button>';
}
function _drawEvoCharts(){
  // Use requestAnimationFrame so DOM is ready; retry if canvas not yet visible
  if(!S._evoCanvasData){return;}
  const raf=()=>{
    const {weeks,weekVols,maxWV,selExId,selDayId}=S._evoCanvasData;
    const cs=getComputedStyle(document.documentElement);
    const clrBd=cs.getPropertyValue('--bd').trim()||'#2a3540';
    const clrBg=cs.getPropertyValue('--sf').trim()||'#1a2430';
    const clrRu=cs.getPropertyValue('--ru').trim()||'#C45A1A';
    const clrOl=cs.getPropertyValue('--ol').trim()||'#6B9E52';
    const clrTx=cs.getPropertyValue('--tx').trim()||'#E8EFF5';
    const clrTx2=cs.getPropertyValue('--tx2').trim()||'#7A8898';

    // ── Gráfico de volume semanal ─────────────────────────────────────────────
    const vc=document.getElementById('evo-vol-canvas');
    if(vc){
      const pw=vc.parentElement?vc.parentElement.getBoundingClientRect().width:0;
      if(pw<10){requestAnimationFrame(raf);return;}  // container ainda não renderizou
      const dpr=window.devicePixelRatio||1;
      const W=Math.floor(pw);const H=140;
      vc.width=W*dpr;vc.height=H*dpr;
      vc.style.width=W+'px';vc.style.height=H+'px';
      const ctx=vc.getContext('2d');
      ctx.scale(dpr,dpr);
      ctx.clearRect(0,0,W,H);
      if(!weeks||!weeks.length){
        // Estado vazio
        ctx.fillStyle=clrTx2;ctx.font='13px sans-serif';ctx.textAlign='center';
        ctx.fillText('Nenhum treino registrado neste per\u00edodo.',W/2,H/2-8);
        ctx.font='11px sans-serif';
        ctx.fillText('Registre s\u00e9ries com peso para ver o gr\u00e1fico.',W/2,H/2+12);
      } else {
        // Eixo Y: 42px à esquerda para rótulos de volume
        const PAD_L=42,PAD_R=8,PAD_T=16,PAD_B=26;
        const CW=W-PAD_L-PAD_R,CH=H-PAD_T-PAD_B;
        const n=weeks.length;
        // Largura máxima da barra: 56px para que n=1 não preencha o canvas todo
        const MAX_BAR=56,MIN_GAP=4;
        const barW=Math.min(MAX_BAR,Math.max(6,Math.floor((CW-MIN_GAP*Math.max(n-1,0))/Math.max(n,1))));
        const gap=n>1?Math.max(MIN_GAP,Math.floor((CW-barW*n)/(n-1))):0;
        const totalBarsW=barW*n+gap*Math.max(n-1,0);
        const startX=PAD_L+Math.floor((CW-totalBarsW)/2);
        const fmtVol=v=>v>=1000?(Math.round(v/100)/10)+'t':Math.round(v)+'kg';
        const MAX=maxWV||1;

        // Eixo Y: grade + rótulos
        const GRIDS=4;
        for(let g=0;g<=GRIDS;g++){
          const y=PAD_T+Math.round(CH*g/GRIDS);
          ctx.strokeStyle=clrBd;ctx.lineWidth=0.5;ctx.setLineDash([3,3]);
          ctx.beginPath();ctx.moveTo(PAD_L,y);ctx.lineTo(W-PAD_R,y);ctx.stroke();
          ctx.setLineDash([]);
          ctx.fillStyle=clrTx2;ctx.font='8px monospace';ctx.textAlign='right';
          ctx.fillText(fmtVol(MAX*(1-g/GRIDS)),PAD_L-3,y+3);
        }
        // Linha base
        ctx.strokeStyle=clrBd;ctx.lineWidth=1;
        ctx.beginPath();ctx.moveTo(PAD_L,PAD_T+CH);ctx.lineTo(W-PAD_R,PAD_T+CH);ctx.stroke();

        // Barras
        weekVols.forEach((v,i)=>{
          const x=startX+i*(barW+gap);
          const barH=CH>0?Math.max(v>0?3:0,Math.round((v/MAX)*CH)):0;
          const y=PAD_T+CH-barH;
          const isLast=(i===n-1);
          const col=isLast?clrRu:'#4A7098';
          const grad=ctx.createLinearGradient(x,y,x,PAD_T+CH);
          grad.addColorStop(0,col);
          grad.addColorStop(1,isLast?'rgba(196,90,26,.3)':'rgba(74,112,152,.3)');
          ctx.fillStyle=grad;
          if(ctx.roundRect){ctx.beginPath();ctx.roundRect(x,y,barW,barH,[3,3,0,0]);ctx.fill();}
          else{ctx.fillRect(x,y,barW,barH);}
          // Valor acima da barra (sempre visível se v>0)
          if(v>0){
            ctx.fillStyle=isLast?clrRu:clrTx2;
            ctx.font='bold 9px monospace';ctx.textAlign='center';
            ctx.fillText(fmtVol(v),x+barW/2,Math.max(PAD_T+10,y-3));
          }
        });

        // Labels datas eixo X
        const _fmtWk=wnum=>{const d=new Date(wnum*7*86400000);return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0');};
        ctx.fillStyle=clrTx2;ctx.font='9px monospace';ctx.textAlign='center';
        if(n===1){
          ctx.fillText(_fmtWk(parseInt(weeks[0])),startX+barW/2,H-4);
        } else if(n<=8){
          weeks.forEach((w,i)=>{ctx.fillText(_fmtWk(parseInt(w)),startX+i*(barW+gap)+barW/2,H-4);});
        } else {
          [0,Math.floor(n/2),n-1].forEach(i=>{ctx.fillText(_fmtWk(parseInt(weeks[i])),startX+i*(barW+gap)+barW/2,H-4);});
        }
      }
    }

    // ── Gráfico de progressão de carga ────────────────────────────────────────
    const lc=document.getElementById('evo-load-canvas');
    if(lc&&selExId){
      const pw2=lc.parentElement?lc.parentElement.getBoundingClientRect().width:0;
      if(pw2<10){requestAnimationFrame(raf);return;}
      const dpr=window.devicePixelRatio||1;
      const W=Math.floor(pw2);const H=150;
      lc.width=W*dpr;lc.height=H*dpr;
      lc.style.width=W+'px';lc.style.height=H+'px';
      const ctx=lc.getContext('2d');
      ctx.scale(dpr,dpr);
      ctx.clearRect(0,0,W,H);
      const pts=[];
      DB.keys('workout:').filter(k=>k.endsWith(':'+selDayId)).sort().forEach(k=>{
        const log=DB.get(k)||{};if(!log[selExId]?.sets)return;
        const maxKg=Math.max(0,...(log[selExId].sets||[]).filter(s=>s.done&&s.kg).map(s=>parseFloat(s.kg)||0));
        if(maxKg>0)pts.push({date:k.split(':')[1],kg:maxKg});
      });
      if(!pts.length){
        ctx.fillStyle=clrTx2;ctx.font='12px sans-serif';ctx.textAlign='center';
        ctx.fillText('Sem registros com peso para este exerc\u00edcio.',W/2,H/2);
      } else if(pts.length===1){
        ctx.beginPath();ctx.arc(W/2,H/2-10,6,0,Math.PI*2);ctx.fillStyle=clrOl;ctx.fill();
        ctx.fillStyle=clrTx;ctx.font='bold 13px sans-serif';ctx.textAlign='center';
        ctx.fillText(pts[0].kg+'kg',W/2,H/2+8);
        ctx.fillStyle=clrTx2;ctx.font='10px sans-serif';ctx.fillText(pts[0].date,W/2,H/2+24);
      } else {
        const PAD_L=38,PAD_R=12,PAD_T=14,PAD_B=24;
        const CW=W-PAD_L-PAD_R,CH=H-PAD_T-PAD_B;
        const minKg=Math.max(0,Math.min(...pts.map(p=>p.kg))-5);
        const maxKg=Math.max(...pts.map(p=>p.kg))+5;
        const range=maxKg-minKg||1;
        const px=i=>PAD_L+Math.round(i/(pts.length-1)*CW);
        const py=kg=>PAD_T+Math.round((1-(kg-minKg)/range)*CH);
        // grade + labels eixo Y
        const GRIDS=4;ctx.setLineDash([3,3]);
        for(let g=0;g<=GRIDS;g++){
          const y=PAD_T+Math.round(CH*g/GRIDS);
          ctx.strokeStyle=clrBd;ctx.lineWidth=0.5;ctx.beginPath();ctx.moveTo(PAD_L,y);ctx.lineTo(W-PAD_R,y);ctx.stroke();
          ctx.fillStyle=clrTx2;ctx.font='9px monospace';ctx.textAlign='right';
          ctx.fillText(Math.round(maxKg-(range*g/GRIDS))+'kg',PAD_L-3,y+3);
        }
        ctx.setLineDash([]);
        // área
        ctx.beginPath();ctx.moveTo(px(0),PAD_T+CH);
        pts.forEach((p,i)=>ctx.lineTo(px(i),py(p.kg)));
        ctx.lineTo(px(pts.length-1),PAD_T+CH);ctx.closePath();
        ctx.fillStyle='rgba(196,90,26,.12)';ctx.fill();
        // linha
        ctx.beginPath();pts.forEach((p,i)=>i===0?ctx.moveTo(px(i),py(p.kg)):ctx.lineTo(px(i),py(p.kg)));
        ctx.strokeStyle=clrRu;ctx.lineWidth=2;ctx.lineJoin='round';ctx.stroke();
        // pontos
        pts.forEach((p,i)=>{
          const isLast=i===pts.length-1;
          ctx.beginPath();ctx.arc(px(i),py(p.kg),isLast?5:3,0,Math.PI*2);
          ctx.fillStyle=isLast?clrOl:clrRu;ctx.fill();
          if(isLast){ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.stroke();}
        });
        // label último valor
        const lp=pts[pts.length-1];
        ctx.fillStyle=clrOl;ctx.font='bold 11px sans-serif';ctx.textAlign='center';
        ctx.fillText(lp.kg+'kg',px(pts.length-1),py(lp.kg)-9);
        // labels datas eixo X
        ctx.fillStyle=clrTx2;ctx.font='9px monospace';ctx.textAlign='center';
        ctx.fillText(pts[0].date.slice(5),px(0),H-4);
        if(pts.length>2)ctx.fillText(pts[Math.floor(pts.length/2)].date.slice(5),px(Math.floor(pts.length/2)),H-4);
        ctx.fillText(pts[pts.length-1].date.slice(5),px(pts.length-1),H-4);
      }
    }
  };
  requestAnimationFrame(raf);
}

function renderContent(){switch(S.tab){case'painel':return renderPainel();case'treino':return renderTreino();case'musculos':return renderMusculos();case'dieta':return renderDieta();case'progresso':return renderProgresso();}}

function remountContent(){document.getElementById('content').innerHTML=renderContent();if(S.tab==='musculos')requestAnimationFrame(_mvInit);}
// Cache de instruções dos exercícios (free-exercise-db)
const _EXDB_URL='https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/dist/exercises.json';
const _EXDB_KEY='exdb_v1';
let _exdbPromise=null;
function _loadExDB(){
  if(_exdbPromise)return _exdbPromise;
  _exdbPromise=new Promise((res,rej)=>{
    try{
      const cached=JSON.parse(localStorage.getItem(_EXDB_KEY)||'null');
      if(cached){res(cached);return;}

          var batch=toMigrate.map(function(k){
            var v=localStorage.getItem(k);
            return v!==null?_db.collection('users').doc(uid).collection('data').doc(_encK(k))
              .set({v:v,ts:firebase.firestore.FieldValue.serverTimestamp()}):null;
          }).filter(Boolean);
          Promise.all(batch).then(function(){localStorage.setItem('_fb_migrated','1');}).catch(function(){});
        }else{localStorage.setItem('_fb_migrated','1');}
      }
    });
  }

  function initFirebase(){
    try{
      firebase.initializeApp(_FCG);
      var _auth=firebase.auth();
      var _db=firebase.firestore();
      var _gprov=new firebase.auth.GoogleAuthProvider();

      window._fbWrite=function(k,vStr){
        if(!window._fbUid)return;
        _db.collection('users').doc(window._fbUid).collection('data').doc(_encK(k))
          .set({v:vStr,ts:firebase.firestore.FieldValue.serverTimestamp()}).catch(function(){});
      };

      _auth.getRedirectResult()
        .then(function(r){if(r&&r.user)console.log('[Auth] redirect captado:',r.user.email);})
        .catch(function(e){console.warn('[Auth] redirect err:',e.message);})
        .finally(function(){window._fbEnableBtnOnce();});

      _auth.onAuthStateChanged(function(user){
        if(!user){_fbShowLogin();return;}
        var email=(user.email||'').toLowerCase();
        if(_ALLOWED.indexOf(email)<0){
          _auth.signOut();_fbShowLogin('E-mail não autorizado: '+user.email);return;
        }
        window._fbUid=user.uid;window._fbEmail=user.email;
        window._fbIsAdmin=_ADMIN.indexOf(email)>=0;
        _fbHideLogin();_fbSetChip(user.email);
        _fbSync(user.uid,_auth,_db).catch(function(e){console.warn('[Firebase] sync erro:',e.message);});
      });

      var btn=document.getElementById('fb-google-btn');
      if(btn)btn.addEventListener('click',function(){
        var errEl=document.getElementById('fb-login-err');
        var lbl=document.getElementById('fb-btn-txt');
        if(lbl)lbl.textContent='Redirecionando...';
        if(errEl)errEl.textContent='';
        _auth.signInWithRedirect(_gprov).catch(function(e){
          if(errEl)errEl.textContent=(e.code||'erro')+': '+e.message.slice(0,120);
          if(lbl)lbl.textContent='Entrar com Google';
        });
      });

      var chip=document.getElementById('fb-user-chip');
      if(chip)chip.addEventListener('click',function(){
        if(!confirm('Sair da conta?'))return;
        _auth.signOut();
        window._fbUid=null;window._fbEmail=null;window._fbIsAdmin=false;
        var c=document.getElementById('fb-user-chip');if(c)c.style.display='none';
      });

    }catch(e){
      console.warn('[Firebase] init erro:',e.message);
      window._fbEnableBtnOnce();
    }
  }

  // Carrega os 3 scripts em cadeia; qualquer falha habilita o botao imediatamente
  loadScript(BASE+'firebase-app-compat.js',
    function(){
      loadScript(BASE+'firebase-auth-compat.js',
        function(){
          loadScript(BASE+'firebase-firestore-compat.js',
            function(){initFirebase();},
            function(){window._fbEnableBtnOnce();}
          );
        },
        function(){window._fbEnableBtnOnce();}
      );
    },
    function(){window._fbEnableBtnOnce();}
  );
})();
</script>
